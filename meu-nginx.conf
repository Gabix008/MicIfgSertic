events { worker_connections 1024; }

http {
    server {
        listen 8082;

        # Rota para o Front-end
        location / {
            proxy_pass http://127.0.0:30080;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # Rota para a API de Usuário
        location /usuario {
            proxy_pass http://127.0.0.1:30002;
        }

        # Rotas para a API de Disciplina
        location /disciplinas { proxy_pass http://127.0.0.1:30001; }
        location /professores { proxy_pass http://127.0.0.1:30001; }
        location /nomeProfessor { proxy_pass http://127.0.0.1:30001; }

        # Rotas para a API de Matrícula
        location /matricula { proxy_pass http://127.0.0.1:30003; }
        location /alunos { proxy_pass http://127.0.0.1:30003; }
        location /nomeAluno { proxy_pass http://127.0.0.1:30003; }
        location /nomeDisciplina { proxy_pass http://127.0.0.1:30003; }
    }
}
